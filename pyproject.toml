[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-cleaning-eval"
version = "0.1.0"
description = "Mini knowledge work eval: data cleaning + summary stats, hybrid programmatic + LLM-judge scoring"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "openai>=1.0",
    "google-generativeai>=0.5",
    "pandas>=2.0",
    "numpy>=1.26",
    "jsonlines>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
